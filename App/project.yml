name: Ferry
options:
  bundleIdPrefix: com.yama
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  FerryKit:
    path: ../FerryKit
targets:
  Ferry:
    type: application
    platform: macOS
    sources: [Ferry]
    dependencies:
      - package: FerryKit
        product: FerryKit
    info:
      path: Ferry/Info.plist
      properties:
        CFBundleDisplayName: Ferry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.yama.ferry.remote-item
            UTTypeDescription: Ferry Remote Item
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yama.Ferry
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # 自分用なのでアドホック署名。サンドボックスなし（iCloud Drive のフォルダと Homebrew の libcurl を使うため）
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
